name: Daily TVBox Source Update

on:
  schedule:
    # Run everyday at 2:00 AM UTC (10:00 AM Beijing time)
    - cron: '0 2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Fetch and Filter Script
      run: |
        python main.py
        
    - name: Commit changes to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Only commit if there are changes
        git add tvbox_clean.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TVBox Clean Sources" && git push)

    - name: Sync to Gitee for Fast Domestic Access
      uses: Yikun/hub-mirror-action@v1.2
      with:
        # Your GitHub repository name (e.g., username/repo)
        src: github/${{ github.repository_owner }}
        # Your Gitee repository owner name
        dst: gitee/${{ github.repository_owner }}
        # Gitee token from Settings -> Personal Access Tokens
        dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
        dst_token: ${{ secrets.GITEE_TOKEN }}
        # Exclude other repos, just sync this one
        static_list: "${{ github.event.repository.name }}"
        force_update: true
