name: Daily TVBox Source Update

on:
  schedule:
    # Run everyday at 2:00 AM UTC (10:00 AM Beijing time)
    - cron: '0 2 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Fetch and Filter Script
      run: |
        python main.py
        
    - name: Commit changes to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Only commit if there are changes
        git add tvbox_clean.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TVBox Clean Sources" && git push)

    - name: Sync to Gitee for Fast Domestic Access
      run: |
        git remote add gitee https://khcys:${{ secrets.GITEE_TOKEN }}@gitee.com/khcys/tv.git
        git fetch --unshallow origin || true
        git push -f gitee HEAD:master
